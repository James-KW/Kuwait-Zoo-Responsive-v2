<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuwait Zoo Admin Login</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#1a6d38,#2e8b57);font:15px 'Segoe UI',Arial,sans-serif;color:#26342b}.box{width:min(100%,410px);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 16px 45px #0003}.head{text-align:center;background:linear-gradient(135deg,#2e8b57,#1a6d38);color:#fff;padding:25px}.head i{font-size:30px}.head h1{font-size:22px;margin:8px 0 4px}.form{padding:25px}.form label{display:block;font-weight:600;margin:0 0 7px}.form input{width:100%;padding:12px;border:1px solid #d7dfd9;border-radius:7px;font:inherit;margin:0 0 15px}.form button{width:100%;padding:12px;border:0;border-radius:7px;background:#2e8b57;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.form button:disabled{opacity:.6}.msg{min-height:22px;color:#ad2020;margin-top:10px}.form a{display:block;text-align:center;margin-top:16px;color:#2e8b57;text-decoration:none}.help{font-size:12px;color:#68756c;margin:12px 0}</style></head>
<body><main class="box"><header class="head"><i class="fa-solid fa-user-shield"></i><h1>Admin Login</h1><div>Kuwait Zoo Management</div></header><form class="form" id="form"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in</button><p class="help">Use the admin user already created in Firebase Authentication.</p><div class="msg" id="message" role="alert"></div><a href="zooinfo.html">Return to public population view</a></form></main>
<script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{firebaseConfig}from'./firebase-config.js';const auth=getAuth(initializeApp(firebaseConfig));const form=document.getElementById('form'),btn=document.getElementById('submit'),msg=document.getElementById('message');onAuthStateChanged(auth,user=>{if(user)location.replace('zooinfo.html')});form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';try{await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);location.replace('zooinfo.html')}catch(error){console.error(error);msg.textContent='Login failed. Check your email, password, and Firebase authorized domain.';btn.disabled=false;btn.textContent='Sign in'}});</script></body></html>
