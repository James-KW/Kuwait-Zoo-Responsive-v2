<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuwait Zoo Population Report</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f5; color: #1f2d1f; }
      .layout { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
      .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .btn { background: #1a6d38; color: white; border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
      .btn.secondary { background: #2d3e50; }
      table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
      th, td { border: 1px solid #dfe9e0; padding: 10px; text-align: center; }
      th { background: #eaf4ee; }
      .species-name { display: flex; align-items: center; justify-content: center; gap: 8px; }
      .delete-species { background: #d33; color: white; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
      .status { margin-top: 12px; font-size: 14px; min-height: 20px; color: #1a6d38; }
      .status.error { color: #b42318; }
      #editControls { margin: 18px 0; }
      .panel { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="controls">
        <h1>Kuwait Zoo Population Report</h1>
        <div class="panel">
          <a href="admin-login.html" class="btn secondary">Admin Login</a>
          <button id="saveBtn" class="btn" type="button">Save</button>
        </div>
      </div>

      <div id="editControls" hidden>
        <button id="editBtn" class="btn" type="button">Enable Edit Mode</button>
      </div>

      <table aria-label="Species population table">
        <thead>
          <tr>
            <th>Species</th>
            <th>Male</th>
            <th>Female</th>
            <th>Unknown</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="speciesRows">
          <tr data-id="lemur">
            <td class="species-name"><span class="emoji">🐒</span><span>Lemur</span></td>
            <td data-field="male">3</td>
            <td data-field="female">4</td>
            <td data-field="unknown">1</td>
            <td>8</td>
            <td><button class="delete-species" type="button">Delete</button></td>
          </tr>
          <tr data-id="chimp_baby">
            <td class="species-name"><span class="emoji">🐵</span><span>Chimpanzee (Baby)</span></td>
            <td data-field="male">1</td>
            <td data-field="female">0</td>
            <td data-field="unknown">0</td>
            <td>1</td>
            <td><button class="delete-species" type="button">Delete</button></td>
          </tr>
        </tbody>
      </table>

      <div id="status" class="status" role="status" aria-live="polite">Loading live data…</div>
    </div>

    <script type="module">
      import { firebaseConfig } from './firebase-config.js';
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
      initializeApp(firebaseConfig);
    </script>
  </body>
</html>
